name: 'Release Tauri App (Desktop + Android)'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Mac (x86_64)
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Strictly Spending v__VERSION__'
          releaseBody: |
            ### Strictly Spending v__VERSION__
            Download the installer for your platform below:
            - **Windows**: `.exe` (NSIS installer) or `.msi`
            - **macOS**: `.dmg` (Apple Silicon `aarch64` or Intel `x64`)
            - **Linux**: `.AppImage` or `.deb`
            - **Android**: `.apk` (arm64 for Pixel, Samsung, and foldables)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-android:
    needs: publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV

      - name: install Rust stable (Android arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache (Android)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-aarch64

      - name: install frontend dependencies
        run: npm ci

      - name: Initialize Android project, build, and sign APK
        run: |
          TOOLCHAIN_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN_BIN/aarch64-linux-android24-clang"

          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          npx tauri android build --apk --target aarch64 --ci

          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found after tauri android build!"
            exit 1
          fi
          echo "Signing APK: $RAW_APK"
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias strictlyspending \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass strictlyspending123 \
            -keypass strictlyspending123 \
            -dname "CN=Strictly Spending, OU=Mobile, O=Strictly Spending, L=US, S=US, C=US"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v -p 4 "$RAW_APK" aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias strictlyspending \
            --ks-pass pass:strictlyspending123 \
            --key-pass pass:strictlyspending123 \
            --out "Strictly-Spending-Android-arm64.apk" \
            aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v "Strictly-Spending-Android-arm64.apk"

      - name: Upload Signed Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG=$(gh release view --json tagName -q .tagName || echo "v0.2.0")
          fi
          gh release upload "$TAG" "Strictly-Spending-Android-arm64.apk" --clobber

